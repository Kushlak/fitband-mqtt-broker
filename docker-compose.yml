version: '3.8'

services:
  websocket-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mock-fitband-websocket
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HTTP_PORT=8080
    ports:
      - "8080:8080"   # HTTP + WebSocket
    restart: unless-stopped
